[package]
name = "reso"
version = "0.1.0"
edition = "2021"

[lib]
name = "reso_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }

[profile.dev]
debug = 0
strip = "debuginfo"
