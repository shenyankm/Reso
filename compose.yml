services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: reso
      POSTGRES_DB: reso
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run setup first}
    ports:
      - "127.0.0.1:55436:5432"
    volumes:
      - reso_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reso -d reso"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  reso_postgres:
